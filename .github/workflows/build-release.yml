name: Build and Test
on:
  push:
    branches:
      - main
      - next
      - next-major
      - alpha
      - beta
      - '[0-9]+.[0-9]+.x'
  pull_request:
    branches:
      - main
      - next
      - next-major
      - alpha
      - beta

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify
    steps:
    - name: Check out current source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        submodules: false
        persist-credentials: false
    - name: Initialize direct build dependencies
      run: git -c submodule.recurse=false submodule update --init --checkout -- references/Hexalith.AI.Tools references/Hexalith.Builds
    - name: Install the selected SDK and net10 runtime
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        dotnet-version: '10.0.404'
    - name: Build the native test executable
      run: dotnet build test/Hexalith.PolymorphicSerializations.Tests/Hexalith.PolymorphicSerializations.Tests.csproj --configuration Release -p:GeneratePackageOnBuild=false -m:1 /nr:false
    - name: Run every unit test without skips
      run: dotnet test/Hexalith.PolymorphicSerializations.Tests/bin/Release/net10.0/Hexalith.PolymorphicSerializations.Tests.dll -automated sync -failSkips
    - name: Test NuGet publication verification
      run: python3 -m unittest discover -s tools -p 'test_*.py'
