name: Build and Test
on:
  push:
    branches:
      - main
      - next
      - next-major
      - alpha
      - beta
      - '[0-9]+.[0-9]+.x'
  pull_request:
    branches:
      - main
      - next
      - next-major
      - alpha
      - beta

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify
    steps:
    - name: Verify build and tests
      uses: Hexalith/Hexalith.Builds/Github/verify@main
      with:
        project-name: ${{ github.event.repository.name }}
    - name: Test NuGet publication verification
      run: python3 -m unittest discover -s tools -p 'test_*.py'
